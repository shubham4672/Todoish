<main>
  <ul class="check-list">
    @for (task of tasks; track task.id) {
      <li>
        <label>
          <input type="checkbox" />
          <span>{{ task.name }}</span>
          <span>{{ task.time }}</span>
        </label>
        <i class="fa-solid fa-trash-can delete-icon" aria-hidden="true" (click)="deleteTask(task.id)"></i>
      </li>
    }
  </ul>
</main>
